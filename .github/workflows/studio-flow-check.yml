name: Studio flow check (self-test)

# Exercises the composite action in action.yml against the bundled example.
# The example has known medium and low findings, so this job uses fail-on: never
# and only checks that the action runs and produces output.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the example flow
        uses: ./
        with:
          files: examples/main-inbound-example.xml
          fail-on: never
          format: text
